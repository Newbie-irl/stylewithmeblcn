<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleWithMeBLCN | Low Stock Alert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div>
                <div class="brand">StyleWithMeBLCN</div>
                <nav class="nav">
                    <a class="nav-link " href="index.html">⌘ <span>Dashboard</span></a>
                    <a class="nav-link " href="products.html">▣ <span>Manage Product</span></a>
                    <a class="nav-link " href="inventory.html">▤ <span>Manage Inventory</span></a>
                    <a class="nav-link active" href="low-stock.html">♧ <span>Low Stock Alert</span></a>
                    <a class="nav-link " href="out-of-stock.html">⊗ <span>Out of Stocks</span></a>
                </nav>
            </div><button class="logout" onclick="logout()">↪ Log Out</button>
        </aside>
        <main class="main">
            <header class="topbar">
                <h1>Low Stock Alert</h1>
                <div class="top-actions"><span class="badge warning">◉ Low Stock</span><span class="badge danger">⊗ Out
                        of Stock</span>
                    <div class="admin">
                        <div class="avatar">◯</div>
                        <div><strong>Admin User</strong><small>admin@gmail.com</small></div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="page-heading">
                    <h2>Low Stock Alert</h2>
                    <p>Review products that are running low and take action.</p>
                </div>
                <section class="table-panel full">
                    <div class="toolbar">
                        <input id="searchInput" type="search" placeholder="Search product...">
                    </div>
                    <div class="table-wrap">
                        <table id="productTable">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Code</th>
                                    <th>Category</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="lowStockBody">
                                <!-- Rendered dynamically by js/script.js -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script src="js/script.js"></script>
    <script>initPage('low-stock');</script>
</body>

</html>
