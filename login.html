<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleWithMeBLCN | Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <div class="login-card">
    <div class="brand" style="text-align:center;">StyleWithMeBLCN</div>
    <p class="login-sub">Sign in to manage your inventory</p>

    <div id="loginError" class="error-msg"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="admin@gmail.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="primary">Log In</button>
    </form>

    <p class="login-hint">Demo credentials: admin@gmail.com / admin123<br>Real authentication arrives with the backend milestone.</p>
  </div>
  <script src="js/script.js"></script>
</body>

</html>
