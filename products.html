<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleWithMeBLCN | Manage Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div>
                <div class="brand">StyleWithMeBLCN</div>
                <nav class="nav">
                    <a class="nav-link " href="index.html">⌘ <span>Dashboard</span></a>
                    <a class="nav-link active" href="products.html">▣ <span>Manage Product</span></a>
                    <a class="nav-link " href="inventory.html">▤ <span>Manage Inventory</span></a>
                    <a class="nav-link " href="low-stock.html">♧ <span>Low Stock Alert</span></a>
                    <a class="nav-link " href="out-of-stock.html">⊗ <span>Out of Stocks</span></a>
                </nav>
            </div><button class="logout" onclick="logout()">↪ Log Out</button>
        </aside>
        <main class="main">
            <header class="topbar">
                <h1>Manage Product</h1>
                <div class="top-actions"><span class="badge warning">◉ Low Stock</span><span class="badge danger">⊗ Out
                        of Stock</span>
                    <div class="admin">
                        <div class="avatar">◯</div>
                        <div><strong>Admin User</strong><small>admin@gmail.com</small></div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="page-heading">
                    <h2>Manage Product</h2>
                    <p>Add, edit, delete, and view products in your catalog.</p>
                </div>
                <section class="table-panel full">
                    <div class="toolbar"><input id="searchInput" type="search" placeholder="Search product..."><button
                            id="addProductBtn" class="primary">+ Add
                            Product</button></div>
                    <div class="table-wrap">
                        <table id="productTable">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Code</th>
                                    <th>Category</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="productBody">
                                <!-- Rendered dynamically by js/script.js -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <div id="productModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Add Product</h3>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Item Name</label>
                    <input type="text" id="productName" placeholder="e.g. Baggy Pants" required>
                </div>
                <div class="form-group">
                    <label for="productCategory">Category</label>
                    <input type="text" id="productCategory" placeholder="e.g. Pants" required>
                </div>
                <div class="form-group">
                    <label for="productStock">Stock Quantity</label>
                    <input type="number" id="productStock" min="0" placeholder="e.g. 10" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
